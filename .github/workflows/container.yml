name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Build the image and actually run it, on every event. Publishing used to be the only
    # thing that built it, so a Dockerfile that no longer worked reached the registry before
    # anyone noticed. amd64 only, no QEMU, so this stays fast enough to gate the publish.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: trajectory-judge:pr
          build-args: TJ_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The default entrypoint still runs the demo
        run: docker run --rm trajectory-judge:pr run --n 8 --judges mock --out /tmp/d --seed 7
      - name: Serve, and answer a request that needs no model
        run: |
          docker run -d --name judge -p 8000:8000 \
            -e TJ_ENABLED_JUDGES=programmatic,mock trajectory-judge:pr serve
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz && break || sleep 1
          done
          curl -fsS http://127.0.0.1:8000/healthz | tee /tmp/health.json
          grep -q '"git_sha": *"${{ github.sha }}"' /tmp/health.json \
            || { echo "healthz did not report the build sha"; cat /tmp/health.json; exit 1; }
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -X POST http://127.0.0.1:8000/v1/judge \
            -H 'content-type: application/json' \
            -d '{"trajectory":{"goal":"refund ORD-1","steps":[],"final_answer":"done"},
                 "judge":"programmatic",
                 "context":{"given":{"order_id":"ORD-1"},
                            "order":{"customer_id":"C-1","status":"delivered"}}}' \
            | tee /tmp/verdict.json
          grep -q '"judge_id"' /tmp/verdict.json
      - name: Logs are line-delimited JSON
        run: |
          docker logs judge > /tmp/logs.txt 2>&1
          test -s /tmp/logs.txt || { echo "the service logged nothing at all"; exit 1; }
          while read -r line; do
            [ -z "$line" ] && continue
            echo "$line" | python3 -c "import json,sys; json.loads(sys.stdin.read())" \
              || { echo "not JSON: $line"; exit 1; }
          done < /tmp/logs.txt
      - name: Stop
        if: always()
        run: docker rm -f judge || true

  publish:
    # Only a container that served a request gets published.
    needs: smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # type=sha guarantees a tag exists even off the default branch,
          # where the semver and latest rules produce nothing.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: TJ_GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
